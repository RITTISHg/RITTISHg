<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff">
        <animate attributeName="stop-color" values="#00d2ff;#ff6fd8;#00d2ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#7a5fff">
        <animate attributeName="stop-color" values="#7a5fff;#00d2ff;#7a5fff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ff6fd8">
        <animate attributeName="stop-color" values="#ff6fd8;#7a5fff;#ff6fd8" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#7a5fff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff6fd8;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)"/>
  
  <!-- Animated particles -->
  <circle cx="100" cy="50" r="2" fill="#00d2ff" opacity="0.6" filter="url(#softGlow)">
    <animate attributeName="cy" values="50;250;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="1.5" fill="#ff6fd8" opacity="0.5" filter="url(#softGlow)">
    <animate attributeName="cy" values="200;30;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="100" r="2.5" fill="#7a5fff" opacity="0.4" filter="url(#softGlow)">
    <animate attributeName="cy" values="100;270;100" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="250" r="1.8" fill="#00d2ff" opacity="0.5" filter="url(#softGlow)">
    <animate attributeName="cy" values="250;20;250" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="80" r="2" fill="#ff6fd8" opacity="0.6" filter="url(#softGlow)">
    <animate attributeName="cy" values="80;220;80" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="180" r="1.5" fill="#7a5fff" opacity="0.5" filter="url(#softGlow)">
    <animate attributeName="cy" values="180;40;180" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="30" r="2" fill="#00ffcb" opacity="0.3" filter="url(#softGlow)">
    <animate attributeName="cy" values="30;260;30" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="270" r="1.2" fill="#ff6fd8" opacity="0.4" filter="url(#softGlow)">
    <animate attributeName="cy" values="270;50;270" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Greeting text -->
  <text x="450" y="85" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a0aec0" opacity="0">
    Hey there 👋, I'm
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Main name -->
  <text x="450" y="145" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#textGrad)" filter="url(#glow)" opacity="0">
    RITTISH G
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- Decorative line -->
  <line x1="250" y1="170" x2="650" y2="170" stroke="url(#lineGrad)" stroke-width="2" opacity="0">
    <animate attributeName="opacity" from="0" to="0.8" dur="0.8s" begin="1s" fill="freeze"/>
  </line>

  <!-- Subtitle / Roles -->
  <text x="450" y="205" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#e2e8f0" opacity="0" letter-spacing="2">
    ⚡ Full-Stack Developer • IoT Enthusiast • AI Explorer
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- Location tag -->
  <text x="450" y="245" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#718096" opacity="0">
    📍 India • 🎓 Electrical Engineering • 💻 Competitive Programmer
    <animate attributeName="opacity" from="0" to="0.8" dur="1s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- Bottom gradient line -->
  <rect x="0" y="295" width="900" height="5" fill="url(#lineGrad)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze"/>
  </rect>
</svg>
