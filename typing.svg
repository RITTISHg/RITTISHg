<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50" viewBox="0 0 600 50">
  <defs>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7a5fff"/>
    </linearGradient>
  </defs>
  
  <style>
    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink { 50% { opacity: 0 } }
    .code-text { font-family: 'Courier New', monospace; font-size: 16px; fill: #a78bfa; }
  </style>

  <text x="10" y="30" class="code-text" fill="url(#codeGrad)">
    const passion = ["Full-Stack", "IoT", "AI", "Clean Code"];
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
